<html>

<head>
    <title>PulseCount</title>
    <link href='https://fonts.googleapis.com/css?family=Lato&subset=latin,latin-ext' rel="stylesheet" type="text/css">
    <title>PulseCount - Home</title>
    <link href="../../odometer/odometer.css?v=VERSION_PLACEHOLDER" rel="stylesheet">
    <link href="../../common.css?v=VERSION_PLACEHOLDER" rel="stylesheet" type="text/css">
    <link href="../../bootstrap.css" rel="stylesheet">
    <link href="../index.css?v=VERSION_PLACEHOLDER" rel="stylesheet" type="text/css">
    <link rel="icon" href="../../logo.svg">
    <meta charSet="utf-8" />
    <meta name="description"
        content="PulseCount — customizable subscriber counters, view counters, comparisons, and rankings." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title"
        content="PulseCount — customizable subscriber counters, view counters, comparisons, and rankings." />
    <meta name="twitter:description"
        content="PulseCount — customizable subscriber counters, view counters, comparisons, and rankings." />
    <meta name="twitter:image" content="https://contatesteparawebsites-commits.github.io/livecountsremaked/images/livecountsedit_video.png" />
    <meta property="og:title"
        content="PulseCount — customizable subscriber counters, view counters, comparisons, and rankings." />
    <meta property="og:description"
        content="PulseCount — customizable subscriber counters, view counters, comparisons, and rankings." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://contatesteparawebsites-commits.github.io/livecountsremaked" />
    <meta property="og:image" content="https://contatesteparawebsites-commits.github.io/livecountsremaked/images/livecountsedit_video.png" />
    <style id="counterColor"></style>
    <link rel="stylesheet" href="../../polish.css">
</head>

<body>
    <div class="lcedit-container">
        <div class="menu">
            <div class="tabs"></div>
            <div class="tab-container">
                <div class="tab-controls"></div><hr>
                <div class="tab-stuff"></div>
            </div>
        </div>
        <div class="counter-content">
            <div class="counter-container">
                <img class="thumbnail" id="counter-avatar" src="../../default_thumbnail.jpg">
                <div class="counter-title" id="counter-title">Title</div>
                <div class="counter odometer" id="counter">0</div>
                <div class="footer" id="footer">Views</div>
                <br>
                <div class="small-counter-row">
                    <div>
                        <div class="counter2 odometer" id="counter2">0</div>
                        <div class="footer" id="footer2">Likes</div>
                    </div>
                    <div>
                        <div class="counter2 odometer" id="counter3">0</div>
                        <div class="footer" id="footer3">Dislikes</div>
                    </div>
                    <div>
                        <div class="counter2 odometer" id="counter4">0</div>
                        <div class="footer" id="footer4">Comments</div>
                    </div>
                </div>
                <div id="counter-chart" style="height: 40%;"></div>
            </div>
        </div>
    </div>
    <div class="page-footer">
        <span>Version <span id="versionNumber"></span> - <a href="../index.html">PulseCount home</a> -- This site is a parody of popular realtime counters. <button class="btn btn-secondary" onclick="toggleFullScreen()">Toggle Full Screen</button></span>
    </div>
    <script src="../../odometer/odometer.js?v=VERSION_PLACEHOLDER"></script>
    <script src="../../bootstrap.js"></script>
    <script src="../../highstock.js"></script>

    <script src="../../converter/converter.js?v=VERSION_PLACEHOLDER"></script>
    <script src="../../commonUtils.js?v=VERSION_PLACEHOLDER"></script>
    <script src="../../commonCounter.js?v=VERSION_PLACEHOLDER"></script>
    <script src="./livecountseditvideo.js?v=VERSION_PLACEHOLDER"></script>
    <script src="../../polish.js"></script>
</body>

</html>
